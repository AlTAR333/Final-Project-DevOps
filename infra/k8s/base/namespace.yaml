# Owner: Mink. Every FulfillOps object lives in this namespace (kustomization sets it).
apiVersion: v1
kind: Namespace
metadata:
  name: fulfillops
  labels:
    app.kubernetes.io/part-of: fulfillops
    # Reject pods that run as root, mount host paths or add capabilities.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Never pruned or deleted by Argo CD: it holds the out-of-Git Secret and the DB volume.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
