# Owner: Mink. Apply with: kubectl apply -k infra/k8s/base
# A release is a Git commit that changes newTag below (infra/kind/build-and-load.sh sets it).
# The Secret fulfillops-db is created out of Git: see secret.example.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fulfillops
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - api-deployment.yaml
  - api-service.yaml
  - worker-deployment.yaml
images:
  - name: fulfillops-api
    newTag: "960f1b7bac00"
  - name: fulfillops-worker
    newTag: "960f1b7bac00"
