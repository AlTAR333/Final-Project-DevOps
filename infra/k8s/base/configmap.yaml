# Owner: Mink. Non-secret settings, names from common/config.py and .env.example.
# Credentials (POSTGRES_PASSWORD, DATABASE_URL) live in the out-of-Git Secret fulfillops-db.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fulfillops-config
  labels:
    app.kubernetes.io/part-of: fulfillops
data:
  # This kind cluster is the isolated lab stack the public checker and reset script target.
  APP_ENV: "test"
  LOG_LEVEL: "INFO"
  API_PORT: "8080"
  POSTGRES_USER: "fulfillops"
  POSTGRES_DB: "fulfillops"
  POLL_INTERVAL_SECONDS: "0.5"
  LEASE_SECONDS: "30"
  MAX_ATTEMPTS: "5"
  BACKOFF_BASE_SECONDS: "1"
  BACKOFF_CAP_SECONDS: "60"
  # Lab-only fault switches: off in Git, so a drill never becomes the reconciled state.
  PROCESSING_DELAY_SECONDS: "0"
  FAULT_INJECTION_ENABLED: "false"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
