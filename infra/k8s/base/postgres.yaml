# Owner: Mink. Single PostgreSQL 16 instance with a PersistentVolumeClaim (kind's default
# local-path StorageClass). Deleting pods or redeploying keeps the data; only deleting the
# PVC (or the cluster) loses it.
apiVersion: v1
kind: Service
metadata:
  name: fulfillops-db
  labels:
    app.kubernetes.io/name: fulfillops-db
    app.kubernetes.io/part-of: fulfillops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None  # headless: stable DNS fulfillops-db -> the StatefulSet pod
  selector:
    app.kubernetes.io/name: fulfillops-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fulfillops-db
  labels:
    app.kubernetes.io/name: fulfillops-db
    app.kubernetes.io/part-of: fulfillops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: fulfillops-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfillops-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fulfillops-db
        app.kubernetes.io/part-of: fulfillops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999  # the postgres user in the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: fulfillops-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA  # subdirectory: the volume root contains lost+found
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
