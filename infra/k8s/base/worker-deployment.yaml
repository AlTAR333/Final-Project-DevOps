# Owner: Mink. Two independent workers. Each claims jobs with its own lease (WORKER_ID = pod
# name), so a killed pod's job is reclaimed by the other once the lease expires. SIGTERM lets
# the current job finish; the grace period covers a full lease.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillops-worker
  labels:
    app.kubernetes.io/name: fulfillops-worker
    app.kubernetes.io/part-of: fulfillops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fulfillops-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fulfillops-worker
        app.kubernetes.io/part-of: fulfillops
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: fulfillops-worker  # tag set in kustomization.yaml (commit SHA)
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: fulfillops-config
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:  # 503 only when the loop has not beaten for 2 leases
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
