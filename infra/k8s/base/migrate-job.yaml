# Owner: Mink. Runs db/migrate.py (Tristan) once per Argo CD sync, after Postgres is healthy
# (wave 1) and before the API and workers roll (wave 2). Migrations are recorded in
# schema_migrations, so re-running is a no-op and the seed never restores spent stock.
# Without Argo CD: kubectl -n fulfillops delete job fulfillops-migrate --ignore-not-found
# before kubectl apply -k, because a Job's pod template is immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: fulfillops-migrate
  labels:
    app.kubernetes.io/name: fulfillops-migrate
    app.kubernetes.io/part-of: fulfillops
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6  # retried while Postgres is still starting
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fulfillops-migrate
        app.kubernetes.io/part-of: fulfillops
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: fulfillops-api  # tag set in kustomization.yaml; image ships db/ for this job
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "db.migrate"]
          envFrom:
            - configMapRef:
                name: fulfillops-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fulfillops-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
