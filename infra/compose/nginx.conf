# Owner: Armand. Local-only front door for the Compose stack: one port (8080) in front of the
# two API instances. Kubernetes uses a Service instead (infra/k8s/base/api-service.yaml).
#
# Runs as the non-root nginx-unprivileged image with a read-only root filesystem, so every
# path nginx writes to is under /tmp (a tmpfs in compose.yaml).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /dev/stdout;  # request line and status only: no headers, bodies or keys are logged

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Round robin. Addresses are resolved when nginx starts: after recreating an API container
    # run `docker compose restart proxy`. (Plain `docker compose restart api-1` keeps its address.)
    upstream api {
        server api-1:8080 max_fails=0;
        server api-2:8080 max_fails=0;
        keepalive 16;
    }

    server {
        listen 8080;

        # The API enforces the 16 KiB contract limit and answers with the JSON error body.
        # This larger cap only stops nginx from buffering huge uploads.
        client_max_body_size 1m;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;

            proxy_connect_timeout 2s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;

            # Retry on the other instance only if the request could not be sent. nginx never
            # re-sends a POST that reached a server (non_idempotent is not enabled), and
            # idempotency keys make an accidental client retry safe anyway.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
    }
}
