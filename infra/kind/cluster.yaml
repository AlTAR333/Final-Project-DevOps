# Owner: Mink. kind create cluster --config infra/kind/cluster.yaml
# localhost:8080 -> NodePort 30080 -> Service fulfillops-api (balanced over Ready API pods).
# Stop the compose stack first: both use host port 8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fulfillops
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
