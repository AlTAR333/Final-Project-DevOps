# Owner: Armand. db (postgres 16 + volume), migrate, 2 API instances behind :8080, 2 workers.
#
# Setup:   cp .env.example .env   (then change POSTGRES_PASSWORD)
# Start:   docker compose up -d --build --wait
# Stop (keeps the data):   docker compose down
# Stop and DELETE the data volume:   docker compose down -v
#
# This stack is the isolated TEST environment used by the public checker (APP_ENV=test).
# Only the proxy (API_PORT) and Postgres (5432) are published, both on 127.0.0.1 only.

name: fulfillops

# --- shared pieces -----------------------------------------------------------------------------

x-database-url: &database-url
  # Inside the Compose network the database host is `db`, not localhost. Credentials come
  # from .env (never committed); the `:?` forms stop `docker compose` if one is missing.
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}

x-api-env: &api-env
  <<: *database-url
  APP_ENV: ${APP_ENV:-test}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_PORT: "8080" # fixed inside the container; the host port is set on the proxy

x-worker-env: &worker-env
  <<: *database-url
  APP_ENV: ${APP_ENV:-test}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-0.5}
  LEASE_SECONDS: ${LEASE_SECONDS:-30}
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
  BACKOFF_BASE_SECONDS: ${BACKOFF_BASE_SECONDS:-1}
  BACKOFF_CAP_SECONDS: ${BACKOFF_CAP_SECONDS:-60}
  PROCESSING_DELAY_SECONDS: ${PROCESSING_DELAY_SECONDS:-0}
  FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-false}

# Runtime hardening for every application container: read-only root filesystem, no Linux
# capabilities, no privilege escalation, a RAM-backed /tmp for the few things that need one.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped

# The API image also runs the migration step, so api-1, api-2 and migrate share it.
x-api-service: &api-service
  <<: *hardening
  build:
    context: .
    dockerfile: api/Dockerfile
  image: fulfillops-api:${IMAGE_TAG:-local}
  environment: *api-env
  mem_limit: 256m
  cpus: 0.5

x-worker-service: &worker-service
  <<: *hardening
  build:
    context: .
    dockerfile: worker/Dockerfile
  image: fulfillops-worker:${IMAGE_TAG:-local}
  depends_on:
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/live', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s
  stop_grace_period: 45s # lets a worker finish its current job after SIGTERM
  mem_limit: 256m
  cpus: 0.5

x-api-healthcheck: &api-healthcheck
  # Ready = database reachable and migrations applied. The proxy only starts once both pass.
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

# --- services ----------------------------------------------------------------------------------

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data # survives `docker compose down` and container recreation
    ports:
      - "127.0.0.1:5432:5432" # host-side tools only (reset script); never exposed to the network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 512m

  migrate:
    <<: *api-service
    command: ["python", "-m", "db.migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no" # one-shot: recorded in schema_migrations, so re-running never restores spent stock
    healthcheck:
      disable: true

  api-1:
    <<: *api-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck

  api-2:
    <<: *api-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck

  worker-1:
    <<: *worker-service
    environment:
      <<: *worker-env
      WORKER_ID: worker-1

  worker-2:
    <<: *worker-service
    environment:
      <<: *worker-env
      WORKER_ID: worker-2

  proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./infra/compose/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 3s
    mem_limit: 64m

volumes:
  pgdata:
